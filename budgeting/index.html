<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Budget - Your Natural Finance Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="leaf-icon">🌿</span>
                    Earth Budget
                </h1>
                <p class="app-subtitle">Grow your financial wellness naturally</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Summary Cards -->
            <section class="summary-section">
                <div class="summary-card total-card">
                    <div class="card-icon">💰</div>
                    <div class="card-content">
                        <h3 class="card-label">Total This Month</h3>
                        <p class="card-value" id="totalSpent">₹0.00</p>
                    </div>
                </div>

                <div class="summary-card categories-card">
                    <div class="card-icon">📊</div>
                    <div class="card-content">
                        <h3 class="card-label">By Category</h3>
                        <div id="categoryBreakdown" class="category-breakdown">
                            <p class="empty-state">No expenses yet</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Add Expense Form -->
            <section class="add-expense-section">
                <h2 class="section-title">Add New Expense</h2>
                <form id="expenseForm" class="expense-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expenseName">Expense Name</label>
                            <input 
                                type="text" 
                                id="expenseName" 
                                name="expenseName" 
                                placeholder="e.g., Grocery shopping"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="expenseAmount">Amount (₹)</label>
                            <input 
                                type="number" 
                                id="expenseAmount" 
                                name="expenseAmount" 
                                placeholder="0.00"
                                step="0.01"
                                min="0"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="expenseCategory">Category</label>
                            <select id="expenseCategory" name="expenseCategory" required>
                                <option value="">Select category</option>
                                <option value="food">🍎 Food & Dining</option>
                                <option value="health">💊 Health & Wellness</option>
                                <option value="transport">🚗 Transportation</option>
                                <option value="entertainment">🎬 Entertainment</option>
                                <option value="utilities">💡 Utilities</option>
                                <option value="shopping">🛍️ Shopping</option>
                                <option value="education">📚 Education</option>
                                <option value="other">🌍 Other</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="btn-text">Add Expense</span>
                        <span class="btn-icon">+</span>
                    </button>
                </form>
            </section>

            <!-- Expenses List -->
            <section class="expenses-section">
                <div class="section-header">
                    <h2 class="section-title">Your Expenses</h2>
                    <button class="btn btn-secondary" id="clearAllBtn">Clear All</button>
                </div>
                
                <div id="expensesList" class="expenses-list">
                    <div class="empty-state-large">
                        <div class="empty-icon">🌱</div>
                        <p>No expenses tracked yet</p>
                        <p class="empty-subtitle">Start by adding your first expense above</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Expense</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="editExpenseForm" class="expense-form">
                <div class="form-group">
                    <label for="editExpenseName">Expense Name</label>
                    <input 
                        type="text" 
                        id="editExpenseName" 
                        name="editExpenseName" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editExpenseAmount">Amount (₹)</label>
                    <input 
                        type="number" 
                        id="editExpenseAmount" 
                        name="editExpenseAmount" 
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editExpenseCategory">Category</label>
                    <select id="editExpenseCategory" name="editExpenseCategory" required>
                        <option value="food">🍎 Food & Dining</option>
                        <option value="health">💊 Health & Wellness</option>
                        <option value="transport">🚗 Transportation</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="utilities">💡 Utilities</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="education">📚 Education</option>
                        <option value="other">🌍 Other</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
